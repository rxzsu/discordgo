version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments: upstream files keep legacy comments
        - -ST1003 # upstream naming (e.g. Id fields) is kept for API compatibility
        - -ST1005 # error strings keep upstream capitalization

formatters:
  enable:
    - gofmt
