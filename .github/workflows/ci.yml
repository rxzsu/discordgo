on:
  push:
  pull_request:

name: CI

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27"]
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Code
        uses: actions/checkout@v7
      - name: Build
        run: go build ./...
      - name: Build voice receive example
        working-directory: examples/voice_receive
        run: go build ./...
      - name: Build linked roles example
        working-directory: examples/linked_roles
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
